plugins {
    id "com.android.application"
}

def signingPropertiesFile = rootProject.file("signing.properties")
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace "io.github.mazemei.dxdisplaycleanup"
    compileSdk 36

    defaultConfig {
        applicationId "io.github.mazemei.dxdisplaycleanup"
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName "1.4.0"
    }

    signingConfigs {
        if (signingPropertiesFile.exists()) {
            release {
                storeFile file(signingProperties["storeFile"])
                storePassword signingProperties["storePassword"]
                keyAlias signingProperties["keyAlias"]
                keyPassword signingProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (signingPropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
